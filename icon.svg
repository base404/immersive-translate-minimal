<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 蒙版以裁剪圆角 -->
    <clipPath id="card-radius">
      <rect width="128" height="128" rx="28" ry="28" />
    </clipPath>
  </defs>
  <!-- 应用圆角蒙版 -->
  <g clip-path="url(#card-radius)">
    <!-- 左半边深色背景 -->
    <rect x="0" y="0" width="64" height="128" fill="#121212" />
    <!-- 右半边浅色背景 -->
    <rect x="64" y="0" width="64" height="128" fill="#F5F5F5" />
    
    <!-- 左侧 T (纯白，在深色背景上，x 范围 34 到 64) -->
    <!-- 横杠左侧段: x:34~64 (宽30), y:38~50 (高12) -->
    <rect x="34" y="38" width="30" height="12" fill="#FFFFFF" />
    <!-- 竖杠左侧段: x:58~64 (宽6), y:50~90 (高40) -->
    <rect x="58" y="50" width="6" height="40" fill="#FFFFFF" />
    
    <!-- 右侧 T (纯黑，在浅色背景上，x 范围 64 到 94) -->
    <!-- 横杠右侧段: x:64~94 (宽30), y:38~50 (高12) -->
    <rect x="64" y="38" width="30" height="12" fill="#121212" />
    <!-- 竖杠右侧段: x:64~70 (宽6), y:50~90 (高40) -->
    <rect x="64" y="50" width="6" height="40" fill="#121212" />
  </g>
</svg>
